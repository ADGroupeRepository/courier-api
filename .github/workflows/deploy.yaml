name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - develop
      - main

env:
  PROJECT_ID: courier-management-501610
  REGION: europe-west1
  REPOSITORY: courier-api
  IMAGE: courier-api-image
  SERVICE: courier-api-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "ENVIRONMENT_UPPER=DEV" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "ENVIRONMENT_UPPER=PROD" >> $GITHUB_ENV
          fi

      - name: Authenticate Dev
        if: github.ref_name == 'develop'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_DEV }}


      - name: Authenticate Prod
        if: github.ref_name == 'main'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_PROD }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set GCP Project
        run: |
          gcloud config set project ${{ env.PROJECT_ID }}

      - name: Docker Authentication
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}-${ENVIRONMENT}/${{ env.IMAGE }}-${ENVIRONMENT}:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}-${ENVIRONMENT}/${{ env.IMAGE }}-${ENVIRONMENT}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }}-${ENVIRONMENT} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}-${ENVIRONMENT}/${{ env.IMAGE }}-${ENVIRONMENT}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=cloudrun-sa-${ENVIRONMENT}@courier-management-501610.iam.gserviceaccount.com \
            --no-allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,TZ=UTC,LOG_LEVEL=info,LOCK_STORE=redis,LIMITER_STORE=redis,REDIS_HOST=country-exquisite-sack-66092.db.redis.io,REDIS_PORT=19713,REDIS_KEY_PREFIX=courier:,APP_URL=https://courier-gateway-a6q7woy6.ew.gateway.dev,OTEL_SERVICE_NAME=courier-api,OTEL_TRACES_EXPORTER=otlp,OTEL_METRICS_EXPORTER=otlp,OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf,OTEL_EXPORTER_OTLP_ENDPOINT=https://qa.wind-drift.online/api/default" \
            --update-secrets="OTEL_EXPORTER_OTLP_HEADERS=OTEL_EXPORTER_OTLP_HEADERS_${ENVIRONMENT_UPPER}:latest,APP_KEY=APP_KEY_${ENVIRONMENT_UPPER}:latest,APPWRITE_KEY=APPWRITE_KEY_${ENVIRONMENT_UPPER}:latest,APPWRITE_PROJECT_ID=APPWRITE_PROJECT_ID_${ENVIRONMENT_UPPER}:latest,APPWRITE_ENDPOINT=APPWRITE_ENDPOINT_${ENVIRONMENT_UPPER}:latest,TEMP_MEMBER_PASSWORD=TEMP_MEMBER_PASSWORD_${ENVIRONMENT_UPPER}:latest,REDIS_PASSWORD=REDIS_PASSWORD_${ENVIRONMENT_UPPER}:latest,RESEND_API_KEY=RESEND_API_KEY_${ENVIRONMENT_UPPER}:latest,MAIL_FROM_ADDRESS=MAIL_FROM_ADDRESS_${ENVIRONMENT_UPPER}:latest"
